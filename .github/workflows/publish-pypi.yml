# Publish the Python CLI to PyPI on tag push or manual dispatch. Verifies
# the tag matches packages/cli-python/pyproject.toml version. Prefers OIDC
# trusted-publisher auth; falls back to PYPI_TOKEN if configured.

name: publish-pypi

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for PyPI trusted publisher

jobs:
  publish:
    name: PyPI publish
    runs-on: ubuntu-latest
    environment: pypi-publish
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(grep -E '^version = ' packages/cli-python/pyproject.toml | head -1 | sed -E 's/version = "(.*)"/\1/')
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match pyproject.toml version $PKG"
            exit 1
          fi
      - name: refresh payload from source-of-truth templates/
        run: |
          rm -rf packages/cli-python/_payload packages/cli-python/src/spec_init/_payload
          cp -R templates packages/cli-python/_payload
          cp -R templates packages/cli-python/src/spec_init/_payload
      - name: build wheel + sdist
        working-directory: packages/cli-python
        run: uv build
      - name: publish (trusted publisher OIDC; fallback to token)
        working-directory: packages/cli-python
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish
