# Post-publish smoke test. After a GitHub release is published (or on
# manual dispatch with a version input), install the released packages
# from the public registries on each OS, scaffold a project, and run
# `spec-init doctor`. Fails the release channel if either registry serves
# a broken artifact.

name: post-publish-smoke

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to smoke-test (e.g. 1.0.0). Omit to use latest.'
        required: false

jobs:
  # ── npm channel ──
  npm-smoke:
    name: npm smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: resolve version
        id: ver
        shell: bash
        run: |
          V="${{ github.event.inputs.version || github.event.release.tag_name }}"
          V="${V#v}"
          echo "version=${V:-latest}" >> "$GITHUB_OUTPUT"
      - name: scaffold via npx
        shell: bash
        run: |
          mkdir -p smoke && cd smoke
          npx --yes spec-init@${{ steps.ver.outputs.version }} init throughspec-smoke --persona engineer
          cd throughspec-smoke
          npx --yes spec-init@${{ steps.ver.outputs.version }} doctor

  # ── PyPI channel ──
  pypi-smoke:
    name: pypi smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: resolve version
        id: ver
        shell: bash
        run: |
          V="${{ github.event.inputs.version || github.event.release.tag_name }}"
          V="${V#v}"
          echo "version=${V:-1.0.0}" >> "$GITHUB_OUTPUT"
      - name: install pipx
        shell: bash
        run: python -m pip install --user pipx && python -m pipx ensurepath
      - name: install spec-init from PyPI
        shell: bash
        run: pipx install "spec-init==${{ steps.ver.outputs.version }}"
      - name: scaffold + doctor
        shell: bash
        run: |
          mkdir -p smoke && cd smoke
          spec-init init throughspec-smoke --persona engineer
          cd throughspec-smoke
          spec-init doctor
