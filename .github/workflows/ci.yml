# Throughspec CI matrix. Runs on every push + PR to development / main.
# Cross-platform verification per SRS §NFR-PORT-01: macOS, Linux, Windows
# × Node 18/20 × Python 3.10/3.11/3.12. Fail-fast off so one bad cell
# does not mask another.

name: ci

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Node CLI: build + Vitest + payload parity on every OS × Node combo ──
  node-tests:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: install
        run: npm ci
      - name: build node CLI
        run: npm run build -w packages/cli-node
      - name: refresh python payload copies (needed by parity check)
        shell: bash
        run: |
          rm -rf packages/cli-python/_payload packages/cli-python/src/spec_init/_payload
          cp -R templates packages/cli-python/_payload
          cp -R templates packages/cli-python/src/spec_init/_payload
      - name: payload parity (SHA-256 manifest)
        run: node tools/check-payload-parity.mjs
      - name: vitest (skips cross-language tests without uv)
        run: npx vitest run

  # ── Python CLI: uv sync + pytest on every OS × Python combo ──
  python-tests:
    name: python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: pin python
        run: uv python install ${{ matrix.python }}
      - name: refresh python payload copies
        shell: bash
        run: |
          rm -rf packages/cli-python/_payload packages/cli-python/src/spec_init/_payload
          cp -R templates packages/cli-python/_payload
          cp -R templates packages/cli-python/src/spec_init/_payload
      - name: sync
        working-directory: packages/cli-python
        run: uv sync --python ${{ matrix.python }}
      - name: pytest
        working-directory: packages/cli-python
        run: uv run pytest tests/ -v

  # ── Cross-language: both runtimes on the same box for parity harness ──
  cross-lang-parity:
    name: cross-language parity / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: install node deps
        run: npm ci
      - name: build node CLI
        run: npm run build -w packages/cli-node
      - name: refresh python payload copies
        shell: bash
        run: |
          rm -rf packages/cli-python/_payload packages/cli-python/src/spec_init/_payload
          cp -R templates packages/cli-python/_payload
          cp -R templates packages/cli-python/src/spec_init/_payload
      - name: sync python
        working-directory: packages/cli-python
        run: uv sync
      - name: cross-language init parity (Node ↔ Python)
        run: npx vitest run tests/cli-parity.test.ts

  # ── Aggregate SRS §9 checks that can run programmatically. Final gate. ──
  acceptance-verify:
    name: acceptance verify
    runs-on: ubuntu-latest
    needs: [node-tests, python-tests, cross-lang-parity]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: install
        run: npm ci
      - name: build node CLI
        run: npm run build -w packages/cli-node
      - name: refresh python payload copies
        run: |
          rm -rf packages/cli-python/_payload packages/cli-python/src/spec_init/_payload
          cp -R templates packages/cli-python/_payload
          cp -R templates packages/cli-python/src/spec_init/_payload
      - name: run acceptance verifier
        run: node tools/verify-acceptance.mjs
