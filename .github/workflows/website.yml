# Build the companion website and run Playwright smoke + link tests against
# the static export. Vercel handles the deploy on its own; this job proves
# the build is reproducible and the routes stay healthy on every push.

name: website

on:
  push:
    branches: [development, main]
    paths:
      - 'website/**'
      - 'design/**'
      - 'CHANGELOG.md'
      - '.github/workflows/website.yml'
  pull_request:
    branches: [development, main]
    paths:
      - 'website/**'
      - 'design/**'
      - 'CHANGELOG.md'
      - '.github/workflows/website.yml'

jobs:
  build:
    name: build + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: install
        run: npm ci
      - name: build website + Pagefind index
        run: npm run build -w @throughspec/website
      - name: install Playwright browsers
        run: npm run -w @throughspec/website test:e2e:install
      - name: e2e (smoke + link check)
        run: npm run test:site
      - name: upload playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: website/playwright-report/
          retention-days: 7
