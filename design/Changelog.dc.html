<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; }
  body{ margin:0; background:#f6f3f1; }
  ::selection{ background:#cfdaf5; }
</style>
</helmet>

<div ref="{{ setRoot }}" style="font-family:'Source Serif 4',serif; background:#f6f3f1; color:#000;">

  <dc-import name="Nav" active="changelog" hint-size="100%,120px"></dc-import>

  <!-- HERO -->
  <section style="max-width:820px; margin:0 auto; padding:72px 32px 40px;">
    <div data-reveal style="font-size:12px; letter-spacing:0.06em; text-transform:uppercase; color:#797776; margin-bottom:18px; opacity:0; transform:translateY(16px); transition:opacity .7s ease, transform .7s ease;">Changelog</div>
    <h1 data-reveal style="font-family:'Source Serif 4',serif; font-weight:400; font-size:50px; line-height:1.08; letter-spacing:-0.02em; margin:0 0 18px; opacity:0; transform:translateY(20px); transition:opacity .75s ease .05s, transform .75s ease .05s;">What’s new in Throughspec.</h1>
    <p data-reveal style="font-size:16px; line-height:1.55; color:#4e4d4d; letter-spacing:-0.02em; margin:0; opacity:0; transform:translateY(20px); transition:opacity .75s ease .12s, transform .75s ease .12s;">Every release follows Keep a Changelog and semantic versioning. The Kit’s own CHANGELOG.md is the source of truth.</p>
  </section>

  <!-- RELEASES -->
  <section style="max-width:820px; margin:0 auto; padding:8px 32px 64px;">
    <sc-for list="{{ releases }}" as="r" hint-placeholder-count="4">
      <div data-reveal style="display:grid; grid-template-columns:150px 1fr; gap:32px; padding:36px 0; border-top:1px solid rgba(0,0,0,0.14); opacity:0; transform:translateY(20px); transition:opacity .7s ease, transform .7s ease;">
        <div style="padding-top:4px;">
          <div style="display:inline-flex; align-items:center; gap:8px; border:1px solid #000; border-radius:100px; padding:5px 13px; font-size:13px; margin-bottom:10px;">{{ r.version }}</div>
          <div style="font-size:12px; color:#797776;">{{ r.date }}</div>
          <sc-if value="{{ r.latest }}" hint-placeholder-val="{{ false }}">
            <div style="display:inline-flex; align-items:center; gap:7px; margin-top:12px; font-size:11px; color:#4e4d4d;"><span style="width:6px; height:6px; border-radius:100px; background:#000; display:inline-block;"></span>Latest</div>
          </sc-if>
        </div>
        <div>
          <h2 style="font-family:'Source Serif 4',serif; font-weight:400; font-size:26px; letter-spacing:-0.02em; margin:0 0 18px;">{{ r.title }}</h2>
          <sc-for list="{{ r.groups }}" as="g" hint-placeholder-count="2">
            <div style="margin-bottom:18px;">
              <div style="font-size:11px; font-weight:500; letter-spacing:0.06em; text-transform:uppercase; color:#000; margin-bottom:10px;">{{ g.kind }}</div>
              <div style="display:flex; flex-direction:column; gap:9px;">
                <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="3">
                  <div style="display:flex; gap:11px; align-items:flex-start; font-size:14px; line-height:1.55; color:#3d3d3d; letter-spacing:-0.02em;">
                    <span style="width:5px; height:5px; border-radius:100px; background:#000; margin-top:7px; flex:none;"></span><span>{{ it }}</span>
                  </div>
                </sc-for>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
    <div style="border-top:1px solid rgba(0,0,0,0.14);"></div>
  </section>

  <dc-import name="Footer" hint-size="100%,440px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  setRoot = (el) => { this.root = el; };
  componentDidMount() {
    const root = this.root || document;
    const reveal = (el) => { el.style.opacity = '1'; el.style.transform = 'none'; };
    const els = root.querySelectorAll('[data-reveal]');
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { reveal(e.target); io.unobserve(e.target); } }), { rootMargin: '0px 0px -7% 0px', threshold: 0.05 });
      els.forEach((el) => io.observe(el));
    } else els.forEach(reveal);
    this._fb = setTimeout(() => els.forEach((el) => { el.style.transition = 'none'; reveal(el); }), 2600);
  }
  componentWillUnmount() { clearTimeout(this._fb); }
  renderVals() {
    return {
      setRoot: this.setRoot,
      releases: [
        { version: 'v1.0.0', date: '2026-06-12', latest: true, title: 'First stable release', groups: [
          { kind: 'Added', items: ['Nine slash commands: init, requirements, design, plan, feature, refactor, bug, docs, sync.','The append-only memory layer with a token ceiling enforced by /spec-sync.','Dual distribution on npm (npx spec-init) and PyPI (pipx install spec-init).'] },
          { kind: 'Changed', items: ['The 6-phase feature cycle is now strictly ordered and gated by default.'] },
        ]},
        { version: 'v0.9.0', date: '2026-05-20', latest: false, title: 'Release candidate', groups: [
          { kind: 'Added', items: ['Graphify and Obsidian integrations, isolated to dedicated config files.','Three-way merge on upgrade \u2014 user content is never overwritten.'] },
          { kind: 'Fixed', items: ['Resumable workflows now recover cleanly after an interrupted phase.'] },
        ]},
        { version: 'v0.7.0', date: '2026-04-30', latest: false, title: 'Memory layer beta', groups: [
          { kind: 'Added', items: ['context.md compression and the < 8k-token load target.','Append-only design-decisions.md with rejected-alternative capture.'] },
          { kind: 'Changed', items: ['Requirements skill now refuses to proceed on empty load-bearing categories.'] },
        ]},
        { version: 'v0.5.0', date: '2026-03-18', latest: false, title: 'Scaffolding preview', groups: [
          { kind: 'Added', items: ['spec-init scaffolds the canonical claude/ and design/ tree.','Persona flag: vibe, student, engineer, team.'] },
        ]},
      ],
    };
  }
}
</script>
</body>
</html>
