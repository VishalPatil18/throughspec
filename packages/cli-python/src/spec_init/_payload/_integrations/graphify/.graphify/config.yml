# Graphify configuration
# https://graphify.net/
#
# This file activates the Graphify code-knowledge-graph integration for
# Throughspec projects. Adjust `include`/`exclude` globs to match your source
# layout. When Graphify is active, prefer graph queries over full-repo greps.

version: 1

include:
  - "src/**"
  - "packages/**"
  - "lib/**"

exclude:
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/.spec-init/**"

graph:
  language_hints: []
  emit_symbols: true
