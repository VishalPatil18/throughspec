[project]
name = "spec-init"
version = "1.0.0"
description = "Throughspec - Spec-driven. Drift-proof. Token-lean. Scaffolds a Claude Code project around a deterministic SDLC."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Vishal Patil", email = "vishalpatil.imp@gmail.com" },
]
requires-python = ">=3.10"
keywords = ["claude", "claude-code", "scaffolding", "spec-driven", "sdlc", "throughspec"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Code Generators",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "merge3>=0.0.8",
]

[dependency-groups]
dev = [
  "pytest>=8",
]

[project.scripts]
spec-init = "spec_init.__main__:main"

[project.urls]
Homepage = "https://throughspec.v-ai.org"
Documentation = "https://throughspec.v-ai.org/docs/"
Repository = "https://github.com/VishalPatil18/throughspec"
Issues = "https://github.com/VishalPatil18/throughspec/issues"
Changelog = "https://throughspec.v-ai.org/changelog/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spec_init"]

[tool.hatch.build.targets.wheel.force-include]
"_payload" = "spec_init/_payload"

[tool.hatch.build.targets.sdist]
include = [
  "src/spec_init",
  "_payload",
  "README.md",
]
