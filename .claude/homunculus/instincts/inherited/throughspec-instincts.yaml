# Throughspec Workflow Add New Skill Or Agent

## Action

Follow the add-new-skill-or-agent workflow:
1. Create or update SKILL.md or agent markdown in templates/.claude/skills/ or templates/.claude/agents/
2. Mirror the new skill or agent in packages/cli-python/src/spec_init/_payload/.claude/skills/ or .../agents/
3. Update tests (e.g., tests/skills.test.ts, tests/agents.test.ts, tests/init.test.ts)
4. Update claude/context.md, claude/learnings.md, claude/plan.md

## Evidence

- Workflow detected from commit patterns
- Frequency: ~3x per month
- Files: templates/.claude/skills/*/SKILL.md, templates/.claude/agents/*.md, packages/cli-python/src/spec_init/_payload/.claude/skills/*/SKILL.md

